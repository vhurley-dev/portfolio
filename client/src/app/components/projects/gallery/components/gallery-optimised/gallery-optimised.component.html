@if (!loading()) {
  <!-- The CDK Virtual Scroll Viewport manages DOM recycling -->
  <cdk-virtual-scroll-viewport [itemSize]="450" class="virtual-viewport">
    <div class="grid">
      <div *cdkVirtualFor="let img of images()" class="card">
        <img [src]="img.url" [alt]="img.title" loading="lazy" />
        <div class="card-info">
          <h3>{{ img.title }}</h3>
          <p class="camera">
            {{ img.metadata?.cameraModel || "Unknown Camera" }}
          </p>
          <span class="views">{{ img.views }} views</span>
        </div>
      </div>
    </div>
  </cdk-virtual-scroll-viewport>
} @else {
  <div class="loading-container">
    <p>Loading full dataset for virtualized rendering...</p>
  </div>
}
