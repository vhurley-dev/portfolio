<div class="container">
  @for (project of projects(); track project.title) {
    <div class="project-outer">
      <div class="project">
        <a [routerLink]="project.projectUrl">
          <h5>
            {{ project.title }}<icon name="ph:arrow-up-right" size="18"></icon>
          </h5>
        </a>
        <img
          role="button"
          src="{{ project.img }}"
          alt="screenshot of {{ project.title }}"
          [routerLink]="project.projectUrl"
        />
        <div class="description">
          <p>{{ project.description }}</p>
          <div class="technology">
            @for (tech of project.tech; track $index) {
              <app-tech-tag [techTag]="tech"></app-tech-tag>
            }
          </div>
        </div>
      </div>
    </div>
  }
</div>
